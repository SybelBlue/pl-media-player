name: Publish release branch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - elements/pl-media-player/**
      - LICENSE
      - README.md
      - release.toml
      - pyproject.toml
      - plvendor-lock.yaml
      - uv.lock
      - .github/workflows/release.yml

concurrency:
  group: pl-media-player-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  UV_CACHE_DIR: /tmp/learnvia-uv-cache

jobs:
  publish:
    name: Build and publish release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked tools
        run: uv sync --locked

      - name: Verify vendored inputs
        run: uv run --locked pl-vendor check installed

      - name: Build and push release branch
        run: uv run --locked pl-vendor release build --push
