<pl-question-panel>
  <h2>External audio URL</h2>
  <p>A direct HTTP(S) media URL uses the native player and supports its playback controls:</p>
  <pl-code language="html">
&lt;pl-media-player
    url="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3"&gt;
&lt;/pl-media-player&gt;
  </pl-code>
  <pl-media-player
    url="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3"
    player-id="external-audio"
  >
  </pl-media-player>
  <p><strong>Expected behavior:</strong> The remote MP3 loads with unlimited playback.</p>
</pl-question-panel>
